name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      discussions: read # 디스커션 내용을 읽기 위해 필요
      id-token: write
      actions: read # PR의 CI 결과를 읽기 위해 필요
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        env:
          # gh CLI로 디스커션을 조회할 때 쓰는 토큰 (discussions: read 권한)
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          additional_permissions: |
            actions: read

          # 디스커션(#번호)을 읽을 수 있게 GraphQL 조회를 허용한다.
          # 교육용 과제이므로 TODO 정답 코드는 쓰지 않도록 규칙을 덧붙인다.
          claude_args: |
            --allowedTools "Bash(gh api graphql:*)"
            --append-system-prompt "이 레포는 NumPy로 2층 신경망을 직접 구현하는 교육용 과제다. src/의 TODO 함수(Affine, ReLU, SoftmaxWithLoss의 forward/backward, SGD.update, train 루프)와 테스트의 정답 코드는 절대 작성하거나 커밋하지 않는다. 질문에는 수식, 배열 shape, 어떤 입력에서 무엇이 틀리는지, 확인할 개념으로만 답한다. 아직 구현하지 않은 TODO와 NotImplementedError는 정상이므로 지적하지 않는다. 댓글에서 디스커션(github.com/NARi3040/KJG-SW-AI-W13-Mnist-Lab/discussions/번호 또는 디스커션 #번호)을 언급하면, 다음 명령으로 내용을 읽는다: gh api graphql -f query='{ repository(owner: \"NARi3040\", name: \"KJG-SW-AI-W13-Mnist-Lab\") { discussion(number: 번호) { title body comments(first: 50) { nodes { author { login } body } } } } }'"
