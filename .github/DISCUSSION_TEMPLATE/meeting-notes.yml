title: "[회의록] YYYY-MM-DD "
body:
  - type: markdown
    attributes:
      value: |
        회의를 클로바노트로 녹음하고, AI가 정리한 내용을 올려요.
        AI에게 이 회의록을 참고시키려면 이슈·PR 댓글에서 `@claude`와 함께 이 디스커션 번호를 적어요. (예: `@claude 디스커션 #5 결정 사항대로 리뷰해 줘`)
  - type: input
    id: attendees
    attributes:
      label: 참석자
      placeholder: 홍길동, 김철수
    validations:
      required: true
  - type: textarea
    id: agenda
    attributes:
      label: 안건
      placeholder: |
        - Day 2 backward 역할 분담
    validations:
      required: true
  - type: textarea
    id: decisions
    attributes:
      label: 결정 사항
      placeholder: |
        - gradient check 통과 후 PR을 올린다
    validations:
      required: true
  - type: textarea
    id: todos
    attributes:
      label: 할 일
      placeholder: |
        - [ ] 설계 문서 작성 (@담당자, #4)
  - type: textarea
    id: related
    attributes:
      label: 관련 이슈 · PR
      placeholder: "#2, #4"
