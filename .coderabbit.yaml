# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# 기본값(chill 프로필, Draft 제외)은 적지 않습니다.
language: ko-KR
tone_instructions: "한국어 합니다체로 짧게 씁니다. 학습 과제이므로 TODO와 테스트의 정답 코드는 쓰지 않습니다."
reviews:
  # 정답 코드가 만들어지는 기능은 끕니다.
  enable_prompt_for_ai_agents: false
  finishing_touches:
    unit_tests:
      enabled: false
    autofix:
      enabled: false
    fix_ci:
      enabled: false
  path_instructions:
    - path: "**"
      instructions: |
        딥러닝 프레임워크 없이 NumPy로 2층 신경망을 직접 구현하는 교육용 과제 저장소입니다.
        TODO 함수는 학습자가 직접 구현해야 합니다. 결함은 어떤 입력에서 무엇이 틀리는지와 확인할 개념만 설명합니다.
        TODO 함수와 테스트에는 코드 제안(suggestion, diff, 의사 코드)을 달지 않습니다. 질문에 답할 때도 정답 코드를 쓰지 않습니다.
        아직 구현하지 않은 TODO와 NotImplementedError는 정상이므로 지적하지 않습니다.
    - path: "**/*.md"
      instructions: |
        docs/technical-writing-principles.md의 원칙을 기준으로 봅니다.
# 이슈의 구현 계획(@coderabbitai plan)에는 풀이가 담길 수 있어 끕니다.
issue_enrichment:
  planning:
    enabled: false
